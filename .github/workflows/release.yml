name: Build & Release TactileBar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: swift test

      - name: Build App Bundle (Ad-Hoc Signed)
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Package ZIP and DMG
        run: |
          ditto -c -k --keepParent TactileBar.app TactileBar-macOS.zip
          hdiutil create -volname "TactileBar" -srcfolder TactileBar.app -ov -format UDZO TactileBar-macOS.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TactileBar-macOS.dmg
            TactileBar-macOS.zip
